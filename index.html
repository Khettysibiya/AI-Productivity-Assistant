<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workplace Productivity Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--bg:#f8fafc;--card:#fff;--primary:#4f46e5;--primary2:#6366f1;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--success:#10b981}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:260px;background:#0f172a;color:#fff;padding:24px 16px;position:fixed;height:100vh;overflow-y:auto;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:32px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-label{font-size:11px;letter-spacing:1.2px;color:#94a3b8;margin:20px 0 8px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;color:#cbd5e1;transition:.2s;font-size:14px;font-weight:500}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:#4f46e5;color:#fff}
.main{margin-left:260px;flex:1;padding:28px 32px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.topbar h1{font-size:24px}
.badge{font-size:12px;padding:6px 12px;background:#e0e7ff;color:#4338ca;border-radius:20px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.card{grid-column:span 12;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{font-size:16px;margin-bottom:4px}
.card p.desc{font-size:13px;color:var(--muted);margin-bottom:16px}
.feature-card{grid-column:span 6}
@media(max-width:900px){.feature-card{grid-column:span 12}.sidebar{width:100%;height:auto;position:relative}.main{margin-left:0}}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary2);box-shadow:0 0 0 3px #e0e7ff}
.btn{padding:11px 18px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:#f1f5f9;color:var(--text)}
.output{margin-top:16px;background:#f8fafc;border:1px dashed var(--border);border-radius:12px;padding:16px;font-size:13px;line-height:1.6;white-space:pre-wrap;min-height:60px}
.loader{display:none;align-items:center;gap:8px;color:var(--primary);font-size:13px;font-weight:600;margin-top:12px}
.dot{width:6px;height:6px;background:var(--primary);border-radius:50%;animation:bounce 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.task-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff}
.pill{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.high{background:#fef2f2;color:#dc2626}.med{background:#fef9c3;color:#a16207}.low{background:#f0fdf4;color:#16a34a}
.chat-box{height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:12px;background:#f8fafc;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.disclaimer{margin-top:24px;padding:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:12px;color:#92400e;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo"><div class="logo-icon">AI</div>Workplace AI</div>
<div class="nav-label">Main</div>
<div class="nav-item active" data-view="dashboard">📊 Dashboard</div>
<div class="nav-item" data-view="email">✉️ Email Generator</div>
<div class="nav-item" data-view="meeting">📝 Meeting Summarizer</div>
<div class="nav-item" data-view="tasks">✅ Task Planner</div>
<div class="nav-item" data-view="research">🔍 Research Assistant</div>
<div class="nav-item" data-view="chat">💬 AI Chatbot</div>
<div style="margin-top:40px;padding:12px;background:#1e293b;border-radius:10px;font-size:12px;line-height:1.5"><b>Khethiwe B. Sibiya</b><br>ALX Project • Public Repo<br>github.com/Khettysibiya</div>
</div>
